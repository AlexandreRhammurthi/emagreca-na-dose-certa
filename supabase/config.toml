[functions.google-oauth-start]
verify_jwt = true

[functions.google-oauth-callback]
verify_jwt = false

[functions.google-calendar-sync]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.record-product-event]
verify_jwt = true

[auth]
site_url = "https://emagrecanadosecerta.com.br"
additional_redirect_urls = ["https://www.emagrecanadosecerta.com.br/**", "https://emagreca-na-dose-certa.arbandeira.workers.dev/**", "https://*.emagreca-na-dose-certa.arbandeira.workers.dev"]

[auth.email]
enable_confirmations = true
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.confirmation]
subject = "Confirme sua conta — Dose Certa"
content_path = "./supabase/templates/confirmation.html"

[storage.vector]
enabled = false
